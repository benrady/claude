[project]
name = "my-project"
version = "0.1.0"
description = "A short description of my project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Add runtime dependencies here, e.g. "requests>=2.32"
]

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=8.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a1",
]

[tool.uv]
# Required to install pre-release packages like ty (alpha)
prerelease = "if-necessary-or-explicit"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["."]
